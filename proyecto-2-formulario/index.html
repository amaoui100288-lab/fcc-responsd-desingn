<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto 2 - Formulario</title>
</head>
<body>
  <h1 id="title">Formulario de Encuesta</h1>
  <p id="description">Descripción del formulario</p>
  <form id="survey-form">
    <label id="name-label">Nombre: <input id="name" type="text" placeholder="Escribe tu nombre" required></label>
    <label id="email-label">Email: <input id="email" type="email" placeholder="Escribe tu email" required></label>
    <label id="number-label">Edad: <input id="number" type="number" min="10" max="99" placeholder="Edad"></label>
    <button id="submit" type="submit">Enviar</button>
  </form>
</body>
</html>
